# LOVE Native AI Architecture Configuration: Tiny Baseline
# Target Parameters: ~5.5 Million
model_name: "love-native-tiny"
architecture: "decoder-only-transformer"

# Vocabulary & Context
vocab_size: 8192
context_length: 512

# Transformer Dimensions
layers: 4
heads: 4
hidden_dim: 256
head_dim: 64            # hidden_dim // heads
ffn_dim: 768            # 3 * hidden_dim for SwiGLU

# Architectural Components
positional_encoding: "rope"
normalization: "rmsnorm"
norm_eps: 1.0e-5
attention: "causal_self_attention"
ffn_activation: "swiglu"
rope_base: 10000.0
tie_embeddings: true
dropout: 0.0

# Initialization
init_method: "normal"
init_std: 0.02

# Training Default Targets (for planning)
precision: "float32"    # Baseline; fp16 supported via amp
micro_batch_size: 1
max_grad_norm: 1.0
